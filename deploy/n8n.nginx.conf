# Optional public address for the shared n8n (only when you pass N8N_DOMAIN).
# Needed so webhooks work from the internet. certbot adds the HTTPS part to this file.
# Filled in by setup_vps.sh: @@N8N_DOMAIN@@ @@N8N_PORT@@
server {
    listen 80;
    listen [::]:80;
    server_name @@N8N_DOMAIN@@;

    server_tokens off;
    client_max_body_size 50m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    access_log /var/log/nginx/n8n.access.log;
    error_log  /var/log/nginx/n8n.error.log;

    location / {
        proxy_pass http://127.0.0.1:@@N8N_PORT@@;
        proxy_http_version 1.1;
        # The n8n editor needs WebSockets and live updates.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}
