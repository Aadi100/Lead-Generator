# Site for @@APP_NAME@@. It answers only for its own domain.
# certbot adds the HTTPS part to this same file. Filled in by setup_vps.sh: @@APP_NAME@@ @@DOMAIN@@ @@PORT@@
server {
    listen 80;
    listen [::]:80;
    server_name @@DOMAIN@@;

    server_tokens off;
    # The dashboard only receives small forms and pasted text.
    client_max_body_size 5m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    access_log /var/log/nginx/@@APP_NAME@@.access.log;
    error_log  /var/log/nginx/@@APP_NAME@@.error.log;

    location / {
        proxy_pass http://127.0.0.1:@@PORT@@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Only the address nginx really saw. Nothing the visitor sent is passed on.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
