<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563EB">
<title>Offline - Lead Radar</title>
<style>
:root{--bg:#F8FAFC;--fg:#0F172A;--muted:#475569;--card:#fff;--bd:#E2E8F0;--pri:#2563EB}
@media (prefers-color-scheme:dark){:root{--bg:#070B14;--fg:#F0F4FB;--muted:#B8C4D8;--card:#0F172A;--bd:#2C3C5C}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:380px;text-align:center;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:32px 24px}
img{width:56px;height:56px;border-radius:14px}h1{font-size:20px;margin:16px 0 8px}p{margin:0 0 20px;color:var(--muted);font-size:14px}
button{font:inherit;font-weight:600;background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 20px;min-height:44px;cursor:pointer}
</style></head><body><main>
<img src="/icons/icon-192.png" alt="" width="56" height="56">
<h1>You are offline</h1>
<p>Lead Radar needs a connection to show your leads. Check your network, or make sure the dashboard is running, then try again.</p>
<button onclick="location.reload()">Try again</button>
</main></body></html>
